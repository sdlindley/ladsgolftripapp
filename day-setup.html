<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Day Setup</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>

<body class="bg-light">

<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
  <div class="container">
    <a class="navbar-brand" href="index.html">Golf Trip</a>
    <div>
      <a class="nav-link text-white" href="days.html">Days Played</a>
      <a class="nav-link text-white" href="golfers.html">Golfers</a>
      <a class="nav-link text-white" href="courses.html">Courses</a>
      <a class="nav-link text-white" href="days.html">Days Played</a>
    </div>
  </div>
</nav>

<div class="container py-5">
  <h1 id="setupTitle" class="mb-4">Day Setup</h1>

  <div id="setupList" class="mb-4"></div>

  <button id="saveBtn" class="btn btn-primary">Save Handicaps</button>
  <a id="scorecardLink" class="btn btn-secondary ms-2">Go to Scorecard</a>
</div>

<script src="js/app.js"></script>
<script>
  // Get day number from URL
  const params = new URLSearchParams(window.location.search);
  const dayNumber = params.get("day");

  document.getElementById("setupTitle").innerText = `Setup – Day ${dayNumber}`;
  document.getElementById("scorecardLink").href = `scorecard.html?day=${dayNumber}`;

  loadDaySetup(dayNumber);
</script>

</body>
</html>
