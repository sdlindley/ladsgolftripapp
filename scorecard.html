<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Scorecard</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>

<body class="bg-light">

<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
  <div class="container">
    <a class="navbar-brand" href="index.html">Golf Trip</a>
    <div>
      <a class="nav-link text-white" href="golfers.html">Golfers</a>
      <a class="nav-link text-white" href="leaderboard.html">Leaderboard</a>
      <a class="nav-link text-white" href="courses.html">Courses</a>
      <a class="nav-link text-white" href="days.html">Days Played</a>
    </div>
  </div>
</nav>

<div class="container py-5">

  <!-- Title -->
  <h1 class="mb-3" id="scorecardTitle">Scorecard</h1>

  <!-- Setup button -->
  <a id="setupLink" class="btn btn-warning mb-4">Setup Handicaps</a>

  <!-- Scorecard table -->
  <div id="scorecards"></div>

  <button class="btn btn-success mt-4" onclick="saveScores(currentDayId)">Save Scores</button>
  <a class="btn btn-info mt-4" href="day-leaderboard.html?day=${dayNumber}">Leaderboard</a>

</div>

<script src="js/app.js"></script>

<script>
  // Get day number from URL
  const params = new URLSearchParams(window.location.search);
  const dayNumber = params.get("day");

  // Link the setup button
  const setupBtn = document.getElementById("setupLink");
  setupBtn.href = `day-setup.html?day=${dayNumber}`;

  // Load scorecard
  loadDynamicScorecard(dayNumber);
</script>

</body>
</html>
