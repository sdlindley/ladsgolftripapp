<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Golfers</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>

<body class="bg-light">

<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
  <div class="container">
    <a class="navbar-brand" href="index.html">Golf Trip</a>
    <div>
      <a class="nav-link text-white" href="golfers.html">Golfers</a>
      <a class="nav-link text-white" href="leaderboard.html">Leaderboard</a>
      <a class="nav-link text-white" href="courses.html">Courses</a>

  </div>

<div class="container py-5">

  <h1 class="mb-4">Golfers</h1>

  <!-- Golfers table -->
  <table class="table table-striped" id="golfersTable">
    <thead>
      <tr>
        <th>Name</th>
        <th>Handicap</th>
        <th>Edit</th>
        <th>Delete</th>
      </tr>
    </thead>
    <tbody></tbody>
  </table>

  <hr class="my-4">

  <!-- Add golfer -->
  <h3>Add Golfer</h3>
  <div class="row g-3">
    <div class="col-md-4">
      <input id="newName" class="form-control" placeholder="Golfer name">
    </div>
    <div class="col-md-2">
      <input id="newHandicap" type="number" class="form-control" placeholder="Handicap">
    </div>
    <div class="col-md-2">
      <button class="btn btn-primary" onclick="addGolfer()">Add</button>
    </div>
  </div>

</div>
